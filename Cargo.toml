[package]
name = "rust-evm"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
alloy-genesis = { version = "2.5.0", default-features = false }
eyre = "0.6"
futures-util = "0.3"
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", rev = "5aa1de6209144cf839a7bbf1a3b40e4664685bff" }
reth-engine-local = { git = "https://github.com/paradigmxyz/reth", rev = "5aa1de6209144cf839a7bbf1a3b40e4664685bff" }
reth-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "5aa1de6209144cf839a7bbf1a3b40e4664685bff", features = ["cli", "node"] }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "5aa1de6209144cf839a7bbf1a3b40e4664685bff" }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth", rev = "5aa1de6209144cf839a7bbf1a3b40e4664685bff" }
serde_json = "1"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.11", features = ["sync"] }
tracing = "0.1"

[patch."https://github.com/alloy-rs/evm2"]
evm2 = { git = "https://github.com/DaniPopes/evm2", rev = "66687c18b34d3bdbb899f5eb7605070615c03475" }
evm2-inspectors = { git = "https://github.com/DaniPopes/evm2", rev = "66687c18b34d3bdbb899f5eb7605070615c03475" }

[patch.crates-io]
reth-codecs = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-codecs-derive = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-rpc-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-zstd-compressors = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
